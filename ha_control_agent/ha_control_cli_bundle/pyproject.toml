[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-control-cli"
version = "0.1.0"
description = "Full-control Home Assistant OS CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ha-control = "ha_control_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["ha_control_cli*"]
