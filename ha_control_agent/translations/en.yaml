name: HA Control Agent
description: High-privilege local control plane for Home Assistant OS.
configuration:
  trusted_cidrs:
    name: Trusted CIDRs
    description: CIDR ranges allowed to call the API.
  session_ttl_seconds:
    name: Session TTL seconds
    description: Lifetime for local session tokens.
  allow_unverified_bootstrap:
    name: Allow unverified bootstrap
    description: Skip LLAT validation against Core (unsafe).
  unsafe_allow_exec:
    name: Unsafe allow exec
    description: Disable command allowlist enforcement (unsafe).
  unsafe_allow_special_paths:
    name: Unsafe allow special paths
    description: Allow operations in /proc, /sys, /dev (unsafe).
  supervisor_token:
    name: Supervisor token override
    description: Optional manual Supervisor API token override when runtime env token is unavailable.
  cli_persistence_root:
    name: CLI persistence root
    description: Persistent root directory for CLI HOME, history, and user-installed tools.
  cli_bootstrap_enabled:
    name: Enable CLI bootstrap
    description: Install missing CLI packages from bootstrap lists on add-on startup.
  cli_bootstrap_npm_packages:
    name: Bootstrap npm packages
    description: npm packages to install persistently under the CLI runtime.
  cli_bootstrap_pipx_packages:
    name: Bootstrap pipx packages
    description: Python CLI packages to install persistently via pipx.
  cli_persist_history:
    name: Persist shell history
    description: Keep shell command history in persistent storage across restarts and updates.
